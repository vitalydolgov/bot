[project]
name = "local-agents"
version = "0.1.0"
description = "Local stateful stand-in for `agents serve`: a SQLite store the worker polls"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1.3",
]

[project.scripts]
local-agents = "local_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
